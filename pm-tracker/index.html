<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PM Switch HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column; sticky tab bar; 16-week strip as the spine; same identity as the portfolio */
:root{
  --bg:#f5f6f8; --paper:#ffffff; --ink:#16203a; --muted:#5a6378; --line:#dde1e9; --soft:#eef0f4;
  --accent:#b8325a; --accent-soft:#f6e3ea; --on-accent:#ffffff;
  --good:#2f7d6b; --good-soft:#e2f0ec; --warn:#a8620a; --warn-soft:#fbefd9; --bad:#b42828; --bad-soft:#f9e1e1;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141f; --paper:#171c2a; --ink:#e8ebf2; --muted:#9aa3b8; --line:#2a3145; --soft:#1e2435;
  --accent:#ec6f93; --accent-soft:#3a1d29; --on-accent:#1a0d13;
  --good:#7cc9b5; --good-soft:#183229; --warn:#f0b35a; --warn-soft:#3a2c12; --bad:#f08a8a; --bad-soft:#3d1c1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141f; --paper:#171c2a; --ink:#e8ebf2; --muted:#9aa3b8; --line:#2a3145; --soft:#1e2435;
  --accent:#ec6f93; --accent-soft:#3a1d29; --on-accent:#1a0d13;
  --good:#7cc9b5; --good-soft:#183229; --warn:#f0b35a; --warn-soft:#3a2c12; --bad:#f08a8a; --bad-soft:#3d1c1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:16px;padding-right:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.top h1{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.01em}
.top .sub{color:var(--muted);margin-top:4px}
.sync{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px}
.strip button{border:0;background:var(--soft);border-radius:6px;height:40px;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--muted);position:relative;padding:0}
.strip button.done{background:var(--good-soft);color:var(--good)}
.strip button.prog{background:var(--warn-soft);color:var(--warn)}
.strip button.now{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink);font-weight:500}
.strip button.sel{background:var(--ink);color:var(--bg)}
.strip button.cp::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.strip-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.strip-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:620px){.strip{grid-template-columns:repeat(8,minmax(0,1fr))}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.stats div{padding:12px 12px 12px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats .n{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.stats .c{font-size:13px;color:var(--muted);line-height:1.3}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;padding-top:6px}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

/* panels */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.wk-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.wk-head h2{font-size:24px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.cp-box{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14.5px}
.cp-box b{color:var(--accent)}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.metrics{grid-template-columns:1fr}}
.metric{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.metric .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.metric .name{font-weight:600;font-size:14px}
.metric .val{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.metric .val small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar span.full{background:var(--good)}
.step{display:flex;gap:6px}
.step button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:17px;line-height:1}
.step button:hover{border-color:var(--ink)}
.metric.off{opacity:.55}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600}
textarea,input[type=text],input[type=date],input[type=url],select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px}
textarea{min-height:76px;resize:vertical}
.btn{border:0;background:var(--accent);color:var(--on-accent);font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{background:var(--bad);color:var(--paper)}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.form-grid{grid-template-columns:1fr}}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tasks li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.tasks li:first-child{border-top:0}
.tasks input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.tasks .t{flex:1;min-width:0}
.tasks .t.done{text-decoration:line-through;color:var(--muted)}
.tasks .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.phase-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 4px;gap:10px}
.phase-h:first-child{margin-top:0}
.phase-h h3{font-size:17px}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
tr.now td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

/* pipeline */
.funnel{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.funnel div{background:var(--soft);border-radius:8px;padding:10px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.funnel .n{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.funnel .c{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
@media (max-width:720px){.funnel{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--paper);min-width:0}
.card h3{font-size:16px;overflow-wrap:anywhere}
.card .who{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.card .next{font-size:13.5px;overflow-wrap:anywhere}
.card .next.due{color:var(--bad);font-weight:600}
.card .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card select{width:auto;flex:1;min-width:120px}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* plan */
.plan h2{font-size:22px;margin-bottom:10px}
.plan ol,.plan ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.plan .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:720px){.plan .cols{grid-template-columns:1fr}}
.plan table{min-width:520px}

.note{border-radius:10px;padding:12px 14px;background:var(--warn-soft);color:var(--ink);font-size:14px}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.bar span{transition:width .25s ease}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <span class="label">Ice cream ingredients → Product Management</span>
      <h1>PM Switch HQ</h1>
      <p class="sub" id="sub">16-week plan · Nov 2, 2026 to Feb 21, 2027</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="sync" id="sync">Saved in this browser</span><button type="button" class="btn ghost small" id="export">Export backup</button><label class="btn ghost small" for="import" style="cursor:pointer">Import backup</label><input type="file" id="import" accept="application/json,.json" hidden></div>
  </div>

  <div id="banner" class="note" hidden></div>

  <div>
    <div class="strip" id="strip" aria-label="Weeks 1 to 16"></div>
    <div class="strip-legend" style="margin-top:8px">
      <span><i style="background:var(--good-soft)"></i>Done</span>
      <span><i style="background:var(--warn-soft)"></i>In progress</span>
      <span><i style="background:var(--accent)"></i>Checkpoint week</span>
      <span>Outlined: this week</span>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <nav class="tabs" aria-label="Sections">
    <a href="#week" data-tab="week">This week</a>
    <a href="#weeks" data-tab="weeks">All weeks</a>
    <a href="#tasks" data-tab="tasks">Deliverables</a>
    <a href="#pipeline" data-tab="pipeline">Outreach pipeline</a>
    <a href="#plan" data-tab="plan">Plan &amp; rules</a>
  </nav>

  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const START=new Date(2026,10,2);
const METRICS=[["msgs","Messages"],["apps","Applications"],["calls","Calls"],["posts","LinkedIn posts"],["learn","Learning hrs"],["prep","Interview prep hrs"]];
const STAGES=["Contacted","Replied","Call","Referral","Applied","Interview","Offer","Closed"];
const PATHS=["Software for food","Food & ingredients"];
const S={db:null,weeks:{},tasks:[],contacts:[],ready:{weeks:false,tasks:false,contacts:false},sel:null,tab:"week",filter:"All",confirm:null,readonly:false};
const pend={};

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const wid=n=>"w"+String(n).padStart(2,"0");
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function curWeek(){const days=Math.floor((Date.now()-START.getTime())/864e5);return Math.min(16,Math.max(1,Math.floor(days/7)+1))}
function fmt(iso){if(!iso)return"";const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function errMsg(e){const c=e&&e.code;if(c==="invalid_argument")return"You can view this tracker but not change it.";if(c==="quota_exceeded")return"The tracker is full. Delete a few old contacts and try again.";if(c==="resource_exhausted")return"Too many changes at once. Wait a moment and try again.";return"Couldn't save that change. Check your connection and try again."}

/* ---- writes: one at a time per document, coalesced ---- */
function save(path,patch,delay){
  if(!S.db)return;
  const p=pend[path]||(pend[path]={patch:{},timer:null,chain:Promise.resolve()});
  Object.assign(p.patch,patch);clearTimeout(p.timer);
  p.timer=setTimeout(()=>{const body=p.patch;p.patch={};
    p.chain=p.chain.then(()=>S.db.doc(path).update(body)).catch(e=>{if(e&&e.code==="invalid_argument")S.readonly=true;toast(errMsg(e))});
  },delay==null?500:delay);
}
function overlay(path,data){const p=pend[path];return p&&Object.keys(p.patch).length?Object.assign({},data,p.patch):data}

/* ---- derived ---- */
function week(n){return S.weeks[wid(n)]}
function metOK(w){if(!w)return false;const t=w.targets||{},a=w.actuals||{};return METRICS.every(([k])=>!(t[k]>0)||(a[k]||0)>=t[k])}
function contactsReplied(){return S.contacts.filter(c=>{const i=STAGES.indexOf(c.stage);return i>=1&&i<=6}).length}

/* ---- render ---- */
function renderStrip(){
  const now=curWeek();let h="";
  for(let n=1;n<=16;n++){const w=week(n);const st=w&&w.status;const cls=[st==="Done"?"done":st==="In progress"?"prog":"",n===now?"now":"",n===S.sel?"sel":"",w&&w.checkpoint?"cp":""].join(" ");
    h+=`<button type="button" class="${cls}" data-week="${n}" aria-label="Week ${n}${w&&w.checkpoint?', checkpoint':''}${st?', '+esc(st):''}">W${String(n).padStart(2,"0")}</button>`}
  $("strip").innerHTML=h;
}
function renderStats(){
  const now=curWeek();const done=S.tasks.filter(t=>t.done).length;
  let nextCp=null;for(let n=now;n<=16;n++){const w=week(n);if(w&&w.checkpoint){nextCp=n;break}}
  const cpDays=nextCp?Math.max(0,Math.ceil((new Date(week(nextCp).end+"T23:59:59")-Date.now())/864e5)):null;
  const tot=S.contacts.length,rep=contactsReplied();const rate=tot?Math.round(rep/tot*100):null;
  $("stats").innerHTML=`
   <div><span class="n">Week ${now}</span><span class="c">of 16 · ${esc(week(now)?week(now).phase.replace(/^\d · /,""):"")}</span></div>
   <div><span class="n">${cpDays==null?"–":cpDays+" days"}</span><span class="c">${nextCp?"to Checkpoint in Week "+nextCp:"No checkpoints left"}</span></div>
   <div><span class="n">${done}/${S.tasks.length}</span><span class="c">deliverables done</span></div>
   <div><span class="n">${rate==null?"–":rate+"%"}</span><span class="c">reply rate · ${tot} contact${tot===1?"":"s"}</span></div>`;
}
function taskItem(t){
  const overdue=!t.done&&t.due&&t.due<todayISO();
  const pr=t.priority==="Checkpoint"?"acc":t.priority==="Must"?"":"";
  const c=S.confirm==="t:"+t.id;
  return `<li><input type="checkbox" id="tk-${esc(t.id)}" data-task="${esc(t.id)}" ${t.done?"checked":""} aria-label="Done: ${esc(t.title)}">
   <div class="t ${t.done?"done":""}"><label for="tk-${esc(t.id)}">${esc(t.title)}</label>
   <div class="meta"><span class="pill ${pr}">${esc(t.priority||"Must")}</span><span class="label">Due ${esc(fmt(t.due))}</span>${overdue?'<span class="pill bad">Overdue</span>':""}</div></div>
   <button type="button" class="btn ${c?"danger":"ghost"} small" data-deltask="${esc(t.id)}">${c?"Confirm delete":"Delete"}</button></li>`;
}
function vWeek(){
  if(!S.ready.weeks)return loading("your weeks");
  const n=S.sel||curWeek();const w=week(n);
  if(!w)return`<div class="panel empty">No plan loaded yet. Ask Claude to set up the 16 weeks for this tracker.</div>`;
  const t=w.targets||{},a=w.actuals||{};const ok=metOK(w);
  const mets=METRICS.map(([k,l])=>{const tg=t[k]||0,av=a[k]||0;const pct=tg?Math.min(100,Math.round(av/tg*100)):(av?100:0);
    return `<div class="metric ${tg?"":"off"}"><div class="row"><span class="name">${l}</span><span class="val">${av}<small> / ${tg}</small></span></div>
    <div class="bar"><span class="${tg&&av>=tg?"full":""}" style="width:${pct}%"></span></div>
    <div class="row"><span class="muted" style="font-size:12.5px">${tg?(av>=tg?"Target met":(tg-av)+" to go"):"No target this week"}</span>
    <span class="step"><button type="button" data-inc="${k}" data-d="-1" aria-label="${l} minus one">−</button><button type="button" data-inc="${k}" data-d="1" aria-label="${l} plus one">+</button></span></div></div>`}).join("");
  const tasks=S.tasks.filter(x=>x.week===n).sort((x,y)=>(x.done-y.done)||String(x.title).localeCompare(y.title));
  return `<div class="grid2">
   <div class="stack">
    <div class="panel stack">
     <div class="wk-head"><div><span class="label">Week ${n} · ${esc(fmt(w.start))} – ${esc(fmt(w.end))}${n===curWeek()?" · this week":""}</span><h2>${esc(w.focus)}</h2><p class="muted" style="margin-top:6px">${esc(w.phase)}</p></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill ${ok?"good":"warn"}">${ok?"Minimums met":"Minimums not met yet"}</span>
      <select id="wk-status" aria-label="Week status" style="width:auto">${["Not started","In progress","Done"].map(s=>`<option ${w.status===s?"selected":""}>${s}</option>`).join("")}</select></div></div>
     <p><b>Deliverables:</b> ${esc(w.deliverables)}</p>
     ${w.checkpoint?`<div class="cp-box"><b>Checkpoint.</b> ${esc(w.checkpoint)}</div>`:""}
    </div>
    <div class="panel stack"><div class="wk-head"><h3>Targets vs. actuals</h3><span class="label">Tap + as you go</span></div><div class="metrics">${mets}</div></div>
   </div>
   <div class="stack">
    <div class="panel"><div class="wk-head" style="margin-bottom:8px"><h3>Due this week</h3><a href="#tasks" class="label">All deliverables</a></div>
     ${tasks.length?`<ul class="tasks">${tasks.map(taskItem).join("")}</ul>`:`<p class="muted">Nothing due this week. Spend the time on the weekly minimums.</p>`}</div>
    <div class="panel stack"><h3>Sunday review</h3>
     <div class="field"><label for="wk-carry">Carry-over to next week</label><textarea id="wk-carry" data-wfield="carry" placeholder="Any minimum you missed moves here">${esc(w.carry||"")}</textarea></div>
     <div class="field"><label for="wk-notes">Notes</label><textarea id="wk-notes" data-wfield="notes" placeholder="What worked, what didn't, what to change">${esc(w.notes||"")}</textarea></div>
     <p class="muted" style="font-size:12.5px">Saves as you type.</p>
    </div>
   </div></div>`;
}
function vWeeks(){
  if(!S.ready.weeks)return loading("your weeks");
  const now=curWeek();let rows="";const tot={};METRICS.forEach(([k])=>tot[k]=[0,0]);
  for(let n=1;n<=16;n++){const w=week(n);if(!w)continue;const t=w.targets||{},a=w.actuals||{};

function persist(){try{localStorage.setItem(KEY,JSON.stringify({weeks:S.weeks,tasks:S.tasks,contacts:S.contacts}))}catch(e){toast("This browser blocked saving. Use Export backup to keep your data.")}}
function find(col,id){return col==="weeks"?S.weeks[id]:S[col].find(x=>x.id===id)}
S.db={
  doc(path){const [col,id]=path.split("/");return{
    update(p){const d=find(col,id);if(d)Object.assign(d,JSON.parse(JSON.stringify(p)));persist();render();return Promise.resolve()},
    delete(){if(col==="weeks")delete S.weeks[id];else S[col]=S[col].filter(x=>x.id!==id);persist();render();return Promise.resolve()}}},
  collection(col){return{add(data){const id=col[0]+Date.now().toString(36)+Math.random().toString(36).slice(2,6);S[col].push(Object.assign({id},data));persist();render();return Promise.resolve()}}}
};
function load(obj){S.weeks=obj.weeks||{};S.tasks=Array.isArray(obj.tasks)?obj.tasks:[];S.contacts=Array.isArray(obj.contacts)?obj.contacts:[]}
let stored=null;try{stored=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){stored=null}
load(stored&&stored.weeks?stored:JSON.parse(JSON.stringify(SEED)));
if(!stored)persist();
S.ready={weeks:true,tasks:true,contacts:true};
$("export").addEventListener("click",()=>{const blob=new Blob([JSON.stringify({weeks:S.weeks,tasks:S.tasks,contacts:S.contacts},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="pm-tracker-backup-"+todayISO()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast("Backup downloaded")});
$("import").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj||typeof obj.weeks!=="object")throw 0;load(obj);persist();render();toast("Backup restored")}catch(er){toast("That file isn't a tracker backup. Choose a file made with Export backup.")}e.target.value=""};r.readAsText(f)});
route();
})();
